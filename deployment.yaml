apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-scaled
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-scaled
  template:
    metadata:
      labels:
        app: devops-scaled
    spec:
      containers:
      - name: app
        image: devops-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000